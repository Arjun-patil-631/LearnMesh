<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnMesh - Correct once. Learn everywhere.</title>
  <!-- Tailwind CSS CDN for instant styling without build errors -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0B0F17; color: #F1F5F9; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState("dashboard"); // dashboard, workspace, teach, explorer, lineage, fleet, status
      const [systemStatus, setSystemStatus] = useState(null);
      const [agents, setAgents] = useState([]);
      const [memories, setMemories] = useState([]);
      const [fleetLearning, setFleetLearning] = useState(null);

      // Workspace State
      const [selectedAgentId, setSelectedAgentId] = useState("agent-support");
      const [userPrompt, setUserPrompt] = useState("Customer Acme Corp requests an immediate refund of $14,500 on their enterprise subscription.");
      const [customerTier, setCustomerTier] = useState("enterprise");
      const [currentInteraction, setCurrentInteraction] = useState(null);
      const [interactionHistory, setInteractionHistory] = useState([]);
      const [isLoading, setIsLoading] = useState(false);

      // Teach the Fleet State
      const [activeCandidate, setActiveCandidate] = useState(null);
      const [customCorrection, setCustomCorrection] = useState("Do not promise an immediate refund for enterprise-contract customers. VP approval is required before making that commitment.");
      const [targetScope, setTargetScope] = useState(["Billing Agent", "Support Agent", "Account Management Agent"]);
      const [promotionSuccess, setPromotionSuccess] = useState(null);

      // Fetch System Data
      const refreshData = async () => {
        try {
          const [statusRes, agentsRes, memsRes, fleetRes] = await Promise.all([
            fetch("/api/system/status").then(r => r.json()),
            fetch("/api/agents").then(r => r.json()),
            fetch("/api/memories").then(r => r.json()),
            fetch("/api/fleet/learning").then(r => r.json())
          ]);
          setSystemStatus(statusRes);
          setAgents(agentsRes);
          setMemories(memsRes);
          setFleetLearning(fleetRes);
        } catch (e) {
          console.error("Fetch error:", e);
        }
      };

      useEffect(() => {
        refreshData();
        const interval = setInterval(refreshData, 10000);
        return () => clearInterval(interval);
      }, []);

      // Execute Agent Interaction
      const handleRunInteraction = async () => {
        setIsLoading(true);
        try {
          const res = await fetch("/api/interactions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              agent_id: selectedAgentId,
              user_prompt: userPrompt,
              task_type: "refund",
              customer_tier: customerTier
            })
          });
          const data = await res.json();
          setCurrentInteraction(data);
          setInteractionHistory(prev => [data, ...prev]);
          refreshData();
        } catch (e) {
          alert("Interaction failed: " + e.message);
        } finally {
          setIsLoading(false);
        }
      };

      // Submit Correction -> Candidate
      const handleCaptureCorrection = async () => {
        if (!currentInteraction) return;
        try {
          const res = await fetch(`/api/interactions/${currentInteraction.interaction_id}/correction`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              correction_text: customCorrection,
              human_reason: "Enterprise compliance policy"
            })
          });
          const candidateData = await res.json();
          setActiveCandidate(candidateData);
          setCurrentTab("teach");
        } catch (e) {
          alert("Correction capture failed: " + e.message);
        }
      };

      // Validate & Promote Lesson to Fleet (Hindsight retain)
      const handlePromoteLesson = async () => {
        if (!activeCandidate) return;
        setIsLoading(true);
        try {
          const res = await fetch(`/api/lessons/${activeCandidate.candidate_id}/validate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              candidate_id: activeCandidate.candidate_id,
              confirmed_lesson: activeCandidate.extracted_lesson,
              target_scope: targetScope
            })
          });
          const result = await res.json();
          setPromotionSuccess(result);
          refreshData();
        } catch (e) {
          alert("Lesson promotion failed: " + e.message);
        } finally {
          setIsLoading(false);
        }
      };

      // Record Outcome Confirmation
      const handleRecordOutcome = async (memId, outcomeType) => {
        if (!currentInteraction) return;
        try {
          const res = await fetch(`/api/interactions/${currentInteraction.interaction_id}/outcome`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              memory_id: memId,
              outcome_type: outcomeType,
              notes: "Verified live in agent workspace"
            })
          });
          const outcomeData = await res.json();
          alert(`Outcome confirmed! New confidence score: ${outcomeData.new_confidence_score} (${outcomeData.new_confidence_level})`);
          refreshData();
        } catch (e) {
          alert("Failed to record outcome: " + e.message);
        }
      };

      // Reset Demo Baseline
      const handleResetDemo = async () => {
        if (!confirm("Reset demo to clean initial state?")) return;
        try {
          await fetch("/api/demo/reset", { method: "POST" });
          setCurrentInteraction(null);
          setActiveCandidate(null);
          setPromotionSuccess(null);
          setInteractionHistory([]);
          refreshData();
          alert("Demo reset successfully!");
        } catch (e) {
          alert("Reset failed: " + e.message);
        }
      };

      return (
        <div className="flex h-screen overflow-hidden">
          {/* Sidebar */}
          <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-4">
            <div>
              <div className="flex items-center space-x-3 px-2 py-3 mb-6">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                  LM
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight tracking-tight text-white">LearnMesh</h1>
                  <p className="text-xs text-indigo-400 font-medium tracking-wide">ORGANIZATIONAL MEMORY</p>
                </div>
              </div>

              <div className="text-[11px] font-semibold text-slate-500 px-3 uppercase tracking-wider mb-2">Navigation</div>
              <nav className="space-y-1">
                {[
                  { id: "dashboard", label: "Fleet Dashboard", icon: "📊" },
                  { id: "workspace", label: "Agent Workspace", icon: "🤖" },
                  { id: "teach", label: "Teach the Fleet", icon: "⚡" },
                  { id: "explorer", label: "Memory Explorer", icon: "🧠" },
                  { id: "lineage", label: "Learning Lineage", icon: "🧬" },
                  { id: "fleet", label: "Fleet Propagation", icon: "🌐" },
                  { id: "status", label: "System Health", icon: "🔌" }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setCurrentTab(item.id)}
                    className={`w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${
                      currentTab === item.id 
                        ? "bg-indigo-600/20 text-indigo-300 border border-indigo-500/30" 
                        : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/60"
                    }`}
                  >
                    <span>{item.icon}</span>
                    <span>{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>

            <div className="pt-4 border-t border-slate-800 space-y-3">
              <div className="bg-slate-950/60 p-3 rounded-lg border border-slate-800/80">
                <div className="flex items-center justify-between text-xs mb-1">
                  <span className="text-slate-400">Hindsight Memory</span>
                  <span className={`w-2 h-2 rounded-full ${systemStatus?.hindsight?.status === 'connected' ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                </div>
                <div className="text-[11px] text-slate-500 truncate">
                  Bank: {systemStatus?.hindsight?.bank_id || "learnmesh-org-fleet"}
                </div>
              </div>

              <button
                onClick={handleResetDemo}
                className="w-full text-xs text-slate-400 hover:text-red-400 border border-slate-800 hover:border-red-900/60 p-2 rounded-lg transition-colors flex items-center justify-center space-x-2"
              >
                <span>🔄</span>
                <span>Reset Demo State</span>
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 overflow-y-auto bg-slate-950 p-8">
            {/* Top Bar Banner */}
            <div className="flex items-center justify-between pb-6 mb-8 border-b border-slate-800/80">
              <div>
                <h2 className="text-2xl font-bold tracking-tight text-white capitalize">
                  {currentTab.replace("_", " ")}
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  Correct once. Learn everywhere. Cross-agent experience transfer layer.
                </p>
              </div>

              <div className="flex items-center space-x-3">
                <span className="text-xs px-3 py-1 bg-indigo-950/80 border border-indigo-800/60 text-indigo-300 rounded-full font-medium">
                  {memories.length} Shared Lessons Retained
                </span>
                <span className="text-xs px-3 py-1 bg-slate-900 border border-slate-800 text-slate-400 rounded-full">
                  Groq: {systemStatus?.groq?.model || "Active"}
                </span>
              </div>
            </div>

            {/* TAB: DASHBOARD */}
            {currentTab === "dashboard" && (
              <div className="space-y-8">
                {/* Visual Impact Banner */}
                <div className="bg-gradient-to-r from-indigo-900/40 via-purple-900/20 to-slate-900 p-6 rounded-2xl border border-indigo-800/40 relative overflow-hidden">
                  <div className="max-w-2xl relative z-10">
                    <span className="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-400/30">
                      LIVE CROSS-AGENT TRANSFER
                    </span>
                    <h3 className="text-xl font-bold text-white mt-3">
                      "I corrected Agent A once, and Agent B learned from that correction later."
                    </h3>
                    <p className="text-sm text-slate-300 mt-2 leading-relaxed">
                      LearnMesh transforms human corrections on individual specialized agents into validated, scoped organizational memory units using Hindsight. Peer agents automatically recall lessons to prevent repeated failures.
                    </p>
                  </div>
                </div>

                {/* Key Metrics */}
                <div className="grid grid-cols-4 gap-4">
                  {[
                    { label: "Active Fleet Agents", value: agents.length || 4, sub: "Billing, Support, Account, Warehouse" },
                    { label: "Shared Fleet Lessons", value: memories.length, sub: "Retained into Hindsight" },
                    { label: "Outcome Confirmations", value: fleetLearning?.total_confirmations || 0, sub: "Reinforced in production" },
                    { label: "Contradictions Surfaced", value: fleetLearning?.total_contradictions || 0, sub: "Transparently flagged" }
                  ].map((stat, i) => (
                    <div key={i} className="bg-slate-900/60 p-5 rounded-xl border border-slate-800/80">
                      <div className="text-xs font-medium text-slate-400">{stat.label}</div>
                      <div className="text-3xl font-bold text-white mt-2">{stat.value}</div>
                      <div className="text-[11px] text-slate-500 mt-1">{stat.sub}</div>
                    </div>
                  ))}
                </div>

                {/* Recent Cross-Agent Transferred Lessons */}
                <div className="bg-slate-900/60 rounded-xl border border-slate-800/80 p-6">
                  <h3 className="text-base font-semibold text-white mb-4 flex items-center justify-between">
                    <span>Recent Organizational Lessons</span>
                    <span className="text-xs text-indigo-400 hover:underline cursor-pointer" onClick={() => setCurrentTab("explorer")}>View All Memories →</span>
                  </h3>

                  {memories.length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-sm">
                      No shared lessons recorded yet. Go to <span className="text-indigo-400 cursor-pointer" onClick={() => setCurrentTab("workspace")}>Agent Workspace</span> to test a correction.
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {memories.slice(0, 5).map(m => (
                        <div key={m.memory_id} className="p-4 rounded-lg bg-slate-950/70 border border-slate-800 flex items-start justify-between">
                          <div className="space-y-1 max-w-2xl">
                            <div className="flex items-center space-x-2">
                              <span className="text-xs font-mono px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800/50">
                                {m.memory_id}
                              </span>
                              <span className="text-xs text-slate-400">
                                Taught by: <strong className="text-slate-200">{m.source_agent}</strong>
                              </span>
                              <span className="text-xs px-2 py-0.5 rounded bg-emerald-950/60 text-emerald-400 border border-emerald-800/40">
                                Confidence: {m.confidence_level} ({Math.round(m.confidence_score * 100)}%)
                              </span>
                            </div>
                            <div className="text-sm font-medium text-slate-200 pt-1">{m.lesson}</div>
                            <div className="text-xs text-slate-500">
                              Eligible Scope: {Array.isArray(m.scope) ? m.scope.join(", ") : "All Fleet"}
                            </div>
                          </div>
                          <div className="text-right text-xs text-slate-500">
                            <div>{m.supporting_outcomes_count} confirmations</div>
                            <div>{m.contradicting_outcomes_count} conflicts</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: WORKSPACE */}
            {currentTab === "workspace" && (
              <div className="grid grid-cols-12 gap-8">
                {/* Left Form: Select Agent & Task */}
                <div className="col-span-5 space-y-6">
                  <div className="bg-slate-900/60 p-6 rounded-xl border border-slate-800/80 space-y-4">
                    <h3 className="text-base font-semibold text-white">Agent Execution Context</h3>

                    <div>
                      <label className="text-xs font-medium text-slate-400 block mb-2">Target Agent</label>
                      <select
                        value={selectedAgentId}
                        onChange={e => setSelectedAgentId(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                      >
                        {agents.map(a => (
                          <option key={a.id} value={a.id}>{a.name} ({a.role})</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-medium text-slate-400 block mb-2">Customer Contract Tier</label>
                      <select
                        value={customerTier}
                        onChange={e => setCustomerTier(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                      >
                        <option value="enterprise">Enterprise Tier (Special Contract Terms)</option>
                        <option value="standard">Standard Self-Serve</option>
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-medium text-slate-400 block mb-2">Incoming User Request</label>
                      <textarea
                        rows="4"
                        value={userPrompt}
                        onChange={e => setUserPrompt(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                      />
                    </div>

                    <button
                      onClick={handleRunInteraction}
                      disabled={isLoading}
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition-colors shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2"
                    >
                      <span>{isLoading ? "Reasoning with Memories..." : "Run Agent Pipeline"}</span>
                      <span>⚡</span>
                    </button>
                  </div>

                  {/* Teach the Fleet Trigger Box (Appears after interaction) */}
                  {currentInteraction && (
                    <div className="bg-slate-900/60 p-6 rounded-xl border border-amber-800/40 space-y-4">
                      <div className="flex items-center space-x-2 text-amber-400 text-sm font-semibold">
                        <span>⚠️</span>
                        <span>Did the Agent Make a Mistake?</span>
                      </div>
                      <p className="text-xs text-slate-400 leading-relaxed">
                        Provide a correction to this agent. You can then click <strong>Teach the Fleet</strong> to propagate the validated lesson across eligible peer agents via Hindsight.
                      </p>

                      <textarea
                        rows="3"
                        value={customCorrection}
                        onChange={e => setCustomCorrection(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-amber-500"
                        placeholder="e.g. Do not promise refunds on enterprise accounts; approval is required first."
                      />

                      <button
                        onClick={handleCaptureCorrection}
                        className="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded-lg text-xs transition-colors flex items-center justify-center space-x-2"
                      >
                        <span>Capture Correction & Teach Fleet</span>
                        <span>→</span>
                      </button>
                    </div>
                  )}
                </div>

                {/* Right Area: Agent Response & Memory Recall Trace */}
                <div className="col-span-7 space-y-6">
                  {currentInteraction ? (
                    <div className="space-y-6">
                      {/* Agent Response Card */}
                      <div className="bg-slate-900/70 p-6 rounded-xl border border-slate-800 space-y-4">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center space-x-2">
                            <span className="text-xs font-semibold uppercase px-2.5 py-1 rounded bg-slate-800 text-slate-300">
                              {currentInteraction.agent_name}
                            </span>
                            <span className={`text-xs px-2.5 py-1 rounded font-medium ${
                              currentInteraction.requires_approval
                                ? 'bg-amber-950 text-amber-300 border border-amber-800/60'
                                : 'bg-emerald-950 text-emerald-300 border border-emerald-800/60'
                            }`}>
                              Action: {currentInteraction.action_type}
                            </span>
                          </div>
                          <span className="text-xs text-slate-500 font-mono">
                            {currentInteraction.interaction_id}
                          </span>
                        </div>

                        <div className="p-4 rounded-lg bg-slate-950 border border-slate-800/90 text-sm text-slate-200 leading-relaxed">
                          {currentInteraction.agent_response}
                        </div>

                        {/* Memory Citation Banner */}
                        {currentInteraction.used_memory_ids?.length > 0 ? (
                          <div className="p-3.5 rounded-lg bg-indigo-950/40 border border-indigo-800/50 flex items-center justify-between">
                            <div className="flex items-center space-x-2 text-xs text-indigo-300">
                              <span>🧠</span>
                              <span>
                                Recalled & Applied Shared Memory: <strong className="font-mono">{currentInteraction.used_memory_ids.join(", ")}</strong>
                              </span>
                            </div>
                            <div className="flex space-x-2">
                              <button
                                onClick={() => handleRecordOutcome(currentInteraction.used_memory_ids[0], "CONFIRMED_SUCCESS")}
                                className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[11px] font-medium"
                              >
                                ✓ Confirm Correct
                              </button>
                              <button
                                onClick={() => handleRecordOutcome(currentInteraction.used_memory_ids[0], "CONTRADICTION")}
                                className="px-2.5 py-1 bg-red-600 hover:bg-red-500 text-white rounded text-[11px] font-medium"
                              >
                                ✕ Contest Memory
                              </button>
                            </div>
                          </div>
                        ) : (
                          <div className="p-3 rounded-lg bg-slate-950 text-xs text-slate-500 border border-slate-800 flex items-center space-x-2">
                            <span>ℹ️</span>
                            <span>No shared organizational memories were cited for this interaction.</span>
                          </div>
                        )}
                      </div>

                      {/* Recalled Memories Breakdown */}
                      <div className="bg-slate-900/60 p-6 rounded-xl border border-slate-800/80 space-y-4">
                        <h4 className="text-sm font-semibold text-white flex items-center justify-between">
                          <span>Organizational Memories Available ({currentInteraction.recalled_memories?.length || 0})</span>
                          <span className="text-xs text-slate-500">Filtered by fleet applicability</span>
                        </h4>

                        <div className="space-y-3">
                          {currentInteraction.recalled_memories?.map((m, idx) => (
                            <div key={idx} className="p-4 rounded-lg bg-slate-950/80 border border-slate-800 space-y-2">
                              <div className="flex items-center justify-between text-xs">
                                <span className="font-mono text-indigo-400 font-semibold">{m.id}</span>
                                <span className="text-slate-400">Source: {m.source_agent || "Fleet"}</span>
                                <span className="text-emerald-400 font-medium">Confidence: {m.confidence_level}</span>
                              </div>
                              <p className="text-xs text-slate-300 font-medium leading-relaxed">{m.text}</p>
                              <div className="text-[11px] text-slate-500">
                                Scope: {Array.isArray(m.scope) ? m.scope.join(", ") : "All"}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="bg-slate-900/40 p-12 rounded-xl border border-slate-800 text-center space-y-3">
                      <div className="text-4xl">🤖</div>
                      <h4 className="text-base font-medium text-slate-300">Ready to execute agent reasoning</h4>
                      <p className="text-xs text-slate-500 max-w-sm mx-auto">
                        Choose an agent and execute a request. If the agent makes a mistake, correct it to initiate fleet learning.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: TEACH THE FLEET */}
            {currentTab === "teach" && (
              <div className="max-w-3xl mx-auto space-y-8">
                <div className="bg-slate-900/70 p-8 rounded-2xl border border-slate-800 space-y-6">
                  <div className="flex items-center space-x-3">
                    <span className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center text-lg">⚡</span>
                    <div>
                      <h3 className="text-lg font-bold text-white">Teach the Fleet: Human Verification Gate</h3>
                      <p className="text-xs text-slate-400">Do not turn every interaction into truth. Validate and scope lessons before promotion into Hindsight.</p>
                    </div>
                  </div>

                  {activeCandidate ? (
                    <div className="space-y-6">
                      <div className="grid grid-cols-2 gap-4">
                        <div className="p-4 rounded-xl bg-red-950/20 border border-red-900/40 space-y-1">
                          <div className="text-[11px] font-semibold text-red-400 uppercase tracking-wider">Original Agent Action</div>
                          <p className="text-xs text-slate-300 mt-1">{activeCandidate.original_action}</p>
                        </div>
                        <div className="p-4 rounded-xl bg-emerald-950/20 border border-emerald-900/40 space-y-1">
                          <div className="text-[11px] font-semibold text-emerald-400 uppercase tracking-wider">Human Correction</div>
                          <p className="text-xs text-slate-300 mt-1">{activeCandidate.correction_text}</p>
                        </div>
                      </div>

                      <div className="space-y-2">
                        <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                          Extracted Reusable Lesson
                        </label>
                        <textarea
                          rows="3"
                          value={activeCandidate.extracted_lesson}
                          onChange={e => setActiveCandidate({ ...activeCandidate, extracted_lesson: e.target.value })}
                          className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500"
                        />
                      </div>

                      {/* Fleet Scope Selection */}
                      <div className="space-y-2">
                        <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block">
                          Applicable Fleet Scope (Who Should Receive This Memory?)
                        </label>
                        <div className="grid grid-cols-2 gap-2">
                          {["Billing Agent", "Support Agent", "Account Management Agent", "Warehouse Operations"].map(agentName => {
                            const isSelected = targetScope.includes(agentName);
                            return (
                              <button
                                key={agentName}
                                onClick={() => {
                                  if (isSelected) {
                                    setTargetScope(targetScope.filter(a => a !== agentName));
                                  } else {
                                    setTargetScope([...targetScope, agentName]);
                                  }
                                }}
                                className={`p-3 rounded-lg text-left text-xs font-medium border transition-colors flex items-center justify-between ${
                                  isSelected 
                                    ? "bg-indigo-950/60 border-indigo-500/50 text-indigo-300"
                                    : "bg-slate-950 border-slate-800 text-slate-500 hover:border-slate-700"
                                }`}
                              >
                                <span>{agentName}</span>
                                <span>{isSelected ? "✓ Eligible" : "✕ Excluded"}</span>
                              </button>
                            );
                          })}
                        </div>
                        <p className="text-[11px] text-slate-500">
                          Notice: Excluded agents (e.g. Warehouse Operations) will never receive this refund memory.
                        </p>
                      </div>

                      {/* Confirm Button */}
                      <div className="pt-4 border-t border-slate-800 flex items-center justify-end space-x-3">
                        <button
                          onClick={() => setActiveCandidate(null)}
                          className="px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 border border-slate-800 hover:bg-slate-800"
                        >
                          Cancel
                        </button>
                        <button
                          onClick={handlePromoteLesson}
                          disabled={isLoading}
                          className="px-5 py-2.5 rounded-lg text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 flex items-center space-x-2"
                        >
                          <span>{isLoading ? "Retaining to Hindsight..." : "Promote & Teach the Fleet"}</span>
                          <span>🚀</span>
                        </button>
                      </div>

                      {/* Success Banner */}
                      {promotionSuccess && (
                        <div className="p-5 rounded-xl bg-emerald-950/40 border border-emerald-800/60 space-y-2 mt-4">
                          <div className="text-xs font-bold text-emerald-400 flex items-center space-x-2">
                            <span>✓</span>
                            <span>Memory Retained & Fleet Updated!</span>
                          </div>
                          <div className="text-xs text-slate-300">
                            Hindsight Memory ID: <strong className="font-mono text-emerald-300">{promotionSuccess.memory_id}</strong>
                          </div>
                          <div className="text-xs text-slate-400">
                            Eligible Agents: {promotionSuccess.eligible_agents.join(", ")}
                          </div>
                          <button
                            onClick={() => {
                              setSelectedAgentId("agent-support");
                              setUserPrompt("Customer Acme Corp requests an immediate refund of $14,500 on their enterprise subscription.");
                              setCurrentTab("workspace");
                            }}
                            className="mt-2 inline-block px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold"
                          >
                            Test with Support Agent Now →
                          </button>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="text-center py-12 text-slate-500 space-y-2">
                      <div className="text-3xl">💡</div>
                      <p className="text-sm font-medium">No pending candidate lessons awaiting validation.</p>
                      <p className="text-xs">Go to the Agent Workspace to correct an agent or run an interaction.</p>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: MEMORY EXPLORER */}
            {currentTab === "explorer" && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Hindsight Organizational Memories</h3>
                  <span className="text-xs text-slate-400 font-mono">Count: {memories.length}</span>
                </div>

                <div className="grid grid-cols-2 gap-4">
                  {memories.map(m => (
                    <div key={m.memory_id} className="p-5 rounded-xl bg-slate-900/70 border border-slate-800 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono font-bold px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800/50">
                          {m.memory_id}
                        </span>
                        <span className={`text-[11px] px-2 py-0.5 rounded font-semibold ${
                          m.confidence_level === 'Strong' ? 'bg-emerald-950 text-emerald-400' : 'bg-slate-800 text-slate-300'
                        }`}>
                          {m.confidence_level} ({Math.round(m.confidence_score * 100)}%)
                        </span>
                      </div>

                      <div className="text-sm font-medium text-slate-200 leading-snug">
                        {m.lesson}
                      </div>

                      <div className="pt-2 border-t border-slate-800/80 text-[11px] text-slate-500 space-y-1">
                        <div>Source Agent: <span className="text-slate-400">{m.source_agent}</span></div>
                        <div>Eligible Fleet: <span className="text-slate-400">{Array.isArray(m.scope) ? m.scope.join(", ") : "All"}</span></div>
                        <div className="flex justify-between pt-1">
                          <span>Confirmations: {m.supporting_outcomes_count}</span>
                          <span>Contradictions: {m.contradicting_outcomes_count}</span>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: LEARNING LINEAGE */}
            {currentTab === "lineage" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <h3 className="text-lg font-bold text-white">Memory Provenance & Verification Lineage</h3>
                <p className="text-xs text-slate-400">
                  Trace any organizational lesson backwards to the human correction and forward to peer agent actions.
                </p>

                {memories.map(m => (
                  <div key={m.memory_id} className="p-6 rounded-xl bg-slate-900/60 border border-slate-800 space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="font-mono text-sm font-bold text-indigo-400">{m.memory_id}</span>
                      <span className="text-xs text-slate-400">Taught by {m.source_agent}</span>
                    </div>

                    {/* Step-by-step diagram */}
                    <div className="space-y-3 pl-4 border-l-2 border-indigo-500/30 text-xs">
                      <div className="relative">
                        <div className="absolute -left-[21px] top-1 w-2.5 h-2.5 rounded-full bg-indigo-500"></div>
                        <div className="font-semibold text-slate-300">1. Original Human Correction</div>
                        <p className="text-slate-500 mt-0.5">Human operator identified error and submitted policy rule.</p>
                      </div>

                      <div className="relative">
                        <div className="absolute -left-[21px] top-1 w-2.5 h-2.5 rounded-full bg-indigo-500"></div>
                        <div className="font-semibold text-slate-300">2. Lesson Validation & Promotion</div>
                        <p className="text-slate-500 mt-0.5">Scoped for Billing, Support, and Account agents.</p>
                      </div>

                      <div className="relative">
                        <div className="absolute -left-[21px] top-1 w-2.5 h-2.5 rounded-full bg-indigo-500"></div>
                        <div className="font-semibold text-slate-300">3. Retained in Hindsight Bank</div>
                        <p className="text-slate-500 mt-0.5">Permanent memory unit indexed with entity graph and tags.</p>
                      </div>

                      <div className="relative">
                        <div className="absolute -left-[21px] top-1 w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                        <div className="font-semibold text-emerald-400">4. Support Agent Recalled & Succeeded</div>
                        <p className="text-slate-500 mt-0.5">Confidence reinforced with {m.supporting_outcomes_count} successful outcome confirmation(s).</p>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB: SYSTEM HEALTH */}
            {currentTab === "status" && (
              <div className="max-w-2xl mx-auto space-y-6">
                <h3 className="text-lg font-bold text-white">System Component Connectivity</h3>

                <div className="space-y-4">
                  <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-sm font-semibold text-slate-200">Hindsight Long-Term Memory</div>
                      <div className="text-xs text-slate-500 mt-0.5">Base URL: {systemStatus?.hindsight?.version ? 'http://localhost:8888' : 'Configured Adapter'}</div>
                    </div>
                    <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60">
                      {systemStatus?.hindsight?.status === 'connected' ? 'Connected' : 'Active (Adapter Mode)'}
                    </span>
                  </div>

                  <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-sm font-semibold text-slate-200">Groq LLM Engine</div>
                      <div className="text-xs text-slate-500 mt-0.5">Model: {systemStatus?.groq?.model}</div>
                    </div>
                    <span className={`text-xs font-semibold px-3 py-1 rounded-full ${
                      systemStatus?.groq?.connected ? 'bg-emerald-950 text-emerald-400' : 'bg-slate-800 text-slate-400'
                    }`}>
                      {systemStatus?.groq?.connected ? 'Live API Active' : 'Deterministic Mode'}
                    </span>
                  </div>

                  <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-sm font-semibold text-slate-200">SQLite Application Metadata</div>
                      <div className="text-xs text-slate-500 mt-0.5">Tracking sessions, lineage, and audit events</div>
                    </div>
                    <span className="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60">
                      Connected
                    </span>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
