    html[data-theme="light"] [class*="hover:text-slate-"]:hover { color: #0f172a !important; }
    /* ===== Professional prototype polish (both themes) ===== */
    html[data-theme="dark"] body { background: radial-gradient(1000px 380px at 50% -120px, rgba(79,70,229,.16), transparent), #07090E !important; }
    html[data-theme="light"] body { background: radial-gradient(1200px 400px at 50% -100px, #e0e7ff, transparent), #eef2f7 !important; }
    header[class*="sticky"] { box-shadow: 0 1px 0 rgba(148,163,184,.18), 0 6px 20px -10px rgba(15,23,42,.25); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    h1, h2, h3 { letter-spacing: -0.015em; }
    [class*="text-2xl"] { letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    thead td, thead th { text-transform: uppercase; font-size: 11px; letter-spacing: .06em; }
    tbody tr { transition: background-color .15s ease; }
    tbody tr:hover { background-color: rgba(99,102,241,.07); }
    main [class*="rounded-xl"][class*="border"] { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    main [class*="rounded-xl"][class*="border"]:hover { transform: translateY(-2px); }
    html[data-theme="light"] main [class*="rounded-xl"][class*="border"]:hover { box-shadow: 0 10px 28px -12px rgba(15,23,42,.22); border-color: #c7d2fe; }

    main [class*="lg:grid-cols-6"] > div:nth-child(6)::before { background: linear-gradient(90deg,#059669,#34d399); }
    .agent-avatar { background: linear-gradient(135deg,#6366f1,#06b6d4); box-shadow: 0 2px 8px rgba(79,70,229,.45); letter-spacing: .02em; }
    main .agent-card:nth-child(2) .agent-avatar { background: linear-gradient(135deg,#8b5cf6,#ec4899); box-shadow: 0 2px 8px rgba(139,92,246,.45); }
    main .agent-card:nth-child(3) .agent-avatar { background: linear-gradient(135deg,#10b981,#14b8a6); box-shadow: 0 2px 8px rgba(16,185,129,.45); }
    main .agent-card:nth-child(4) .agent-avatar { background: linear-gradient(135deg,#f59e0b,#ef4444); box-shadow: 0 2px 8px rgba(245,158,11,.45); }
    main .agent-card:nth-child(5) .agent-avatar { background: linear-gradient(135deg,#0ea5e9,#6366f1); box-shadow: 0 2px 8px rgba(14,165,233,.45); }
    main .agent-card:nth-child(6) .agent-avatar { background: linear-gradient(135deg,#ec4899,#8b5cf6); box-shadow: 0 2px 8px rgba(236,72,153,.45); }
    main .agent-card:nth-child(7) .agent-avatar { background: linear-gradient(135deg,#14b8a6,#0ea5e9); box-shadow: 0 2px 8px rgba(20,184,166,.45); }
    main .agent-card:nth-child(8) .agent-avatar { background: linear-gradient(135deg,#f43f5e,#f59e0b); box-shadow: 0 2px 8px rgba(244,63,94,.45); }

<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-600 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState("dashboard");
      // Light / dark theme with persistence
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem("learnmesh-theme") || "dark"; } catch (e) { return "dark"; }
      });
      useEffect(() => {
        try {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("learnmesh-theme", theme);
        } catch (e) {}
      }, [theme]);
      const [systemStatus, setSystemStatus] = useState(null);
      const [agents, setAgents] = useState([]);
      const [memories, setMemories] = useState([]);
      const [auditIntegrity, setAuditIntegrity] = useState(null);
      const [impactMetrics, setImpactMetrics] = useState(null);
      const [approvalRequests, setApprovalRequests] = useState([]);
      const [contradictions, setContradictions] = useState([]);
      const [auditLog, setAuditLog] = useState([]);

      // Workspace State
      const [selectedAgentId, setSelectedAgentId] = useState("Billing Agent");
      const [userPrompt, setUserPrompt] = useState("Customer Acme Corp requests an immediate refund of $14,500 on their enterprise subscription.");
      const [customerTier, setCustomerTier] = useState("enterprise");
      const [use7StepPipeline, setUse7StepPipeline] = useState(true);
      const [currentInteraction, setCurrentInteraction] = useState(null);
      const [isLoading, setIsLoading] = useState(false);

      // Tool execution state
      const [actionAmount, setActionAmount] = useState(150);
      const [actionConfirmed, setActionConfirmed] = useState(false);
      const [actionResult, setActionResult] = useState(null);

      // Teach / Validation state
      const [customCorrection, setCustomCorrection] = useState("Do not promise an immediate refund for enterprise-contract customers. All refunds require a verified return label and managerial review.");
      const [targetScope, setTargetScope] = useState(["Billing Agent", "Support Agent", "Account Management Agent", "Warehouse Operations"]);
      const [promotionStatus, setPromotionStatus] = useState(null);

      // Evaluation state
      const [benchmarks, setBenchmarks] = useState(null);
      const [isBenchmarking, setIsBenchmarking] = useState(false);

      // Memory Explorer selection
      const [selectedMemory, setSelectedMemory] = useState(null);
      const [memoryVersions, setMemoryVersions] = useState([]);
      const [confidenceBreakdown, setConfidenceBreakdown] = useState(null);

      // Guided Demo Story state
      const [demoRunning, setDemoRunning] = useState(false);
      const [demoStep, setDemoStep] = useState(0);
      const [demoLog, setDemoLog] = useState([]);

      // GDPR tool
      const [forgetCustId, setForgetCustId] = useState("cust-enterprise-01");
      const [forgetResult, setForgetResult] = useState(null);

      // Refresh Data
      const refreshData = async () => {
        try {
          const [statusRes, agentsRes, memsRes, auditRes, metricsRes, apprRes, contRes, logRes] = await Promise.all([
            fetch("/api/v1/system/status").then(r => r.json()).catch(() => null),
            fetch("/api/v1/agents").then(r => r.json()).catch(() => []),
            fetch("/api/v1/memories").then(r => r.json()).catch(() => []),
            fetch("/api/v1/governance/audit-log/verify").then(r => r.json()).catch(() => null),
            fetch("/api/v1/evaluation/metrics").then(r => r.json()).catch(() => null),
            fetch("/api/v1/governance/approvals").then(r => r.json()).catch(() => []),
            fetch("/api/v1/governance/contradictions").then(r => r.json()).catch(() => []),
            fetch("/api/v1/governance/audit-log?limit=20").then(r => r.json()).catch(() => [])
          ]);
          setSystemStatus(statusRes);
          setAgents(agentsRes || []);
          setMemories(memsRes || []);
          setAuditIntegrity(auditRes);
          setImpactMetrics(metricsRes);
          setApprovalRequests(apprRes || []);
          setContradictions(contRes || []);
          setAuditLog(logRes || []);
        } catch (e) {
          console.error("Fetch error:", e);
        }
      };

      useEffect(() => {
        refreshData();
        const interval = setInterval(refreshData, 30000);
        return () => clearInterval(interval);
      }, []);

      // Run Agent Interaction
      const handleRunInteraction = async () => {
        setIsLoading(true);
        try {
          const endpoint = use7StepPipeline ? "/api/v1/agents/pipeline/execute" : "/api/v1/interactions";
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              agent_id: selectedAgentId,
              user_prompt: userPrompt,
              task_type: "refund",
              customer_tier: customerTier
            })
          });
          const data = await res.json();
          setCurrentInteraction(data);
          refreshData();
        } catch (e) {
          alert("Interaction failed: " + e.message);
        } finally {
          setIsLoading(false);
        }
      };

      // Submit Correction & Validate
      const handleTeachFleet = async () => {
        setIsLoading(true);
        setPromotionStatus(null);
        try {
          // 1. Run interaction first if none exists
          let interId = currentInteraction ? (currentInteraction.interaction_id || currentInteraction.id) : null;
          if (!interId) {
            const iRes = await fetch("/api/v1/interactions", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                agent_id: "Billing Agent",
                user_prompt: userPrompt,
                task_type: "refund",
                customer_tier: "enterprise"
              })
            });
            const iData = await iRes.json();
            interId = iData.interaction_id || iData.id;
          }

          // 2. Submit correction
          const cRes = await fetch(`/api/v1/interactions/${interId}/correction`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              correction_text: customCorrection,
              human_reason: "Standard organizational policy enforcement"
            })
          });
          const cData = await cRes.json();

          // 3. Validate and promote into shared memory
          const vRes = await fetch(`/api/v1/lessons/${cData.candidate_id}/validate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              candidate_id: cData.candidate_id,
              confirmed_lesson: customCorrection,
              target_scope: targetScope
            })
          });
          const vData = await vRes.json();
          setPromotionStatus(vData);
          refreshData();
        } catch (e) {
          alert("Teaching fleet failed: " + e.message);
        } finally {
          setIsLoading(false);
        }
      };

      // Execute Tool Action Guardrail
      const handleExecuteToolAction = async (mode) => {
        try {
          const res = await fetch("/api/v1/agents/actions/execute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action_name: "process_refund",
              parameters: { amount: actionAmount, customer_id: "cust-enterprise-01" },
              mode: mode,
              agent_id: selectedAgentId,
              user_confirmed: actionConfirmed
            })
          });
          const data = await res.json();
          setActionResult(data);
          refreshData();
        } catch (e) {
          alert("Tool execution failed: " + e.message);
        }
      };

      // Run Benchmark Suite (live AI first, fast deterministic fallback for serverless timeouts)
      const handleRunBenchmarks = async () => {
        setIsBenchmarking(true);
        try {
          let res = await fetch("/api/v1/evaluation/run-benchmarks?mode=AFTER_LEARNING", { method: "POST" });
          if (!res.ok) {
            res = await fetch("/api/v1/evaluation/run-benchmarks?mode=AFTER_LEARNING&fast=true", { method: "POST" });
          }
          const data = await res.json();
          if (data.detail) throw new Error(data.detail);
          setBenchmarks(data);
          refreshData();
        } catch (e) {
          alert("Benchmark run failed: " + e.message);
        } finally {
          setIsBenchmarking(false);
        }
      };

      // View Memory Details
      const handleSelectMemory = async (mem) => {
        setSelectedMemory(mem);
        try {
          const [vRes, cRes] = await Promise.all([
            fetch(`/api/v1/memories/${mem.memory_id}/versions`).then(r => r.json()).catch(() => []),
            fetch(`/api/v1/memories/${mem.memory_id}/confidence-breakdown`).then(r => r.json()).catch(() => null)
          ]);
          setMemoryVersions(vRes);
          setConfidenceBreakdown(cRes);
        } catch (e) {
          console.error(e);
        }
      };

      // Rollback Memory
      const handleRollback = async (memId, verNum) => {
        if (!confirm(`Rollback memory ${memId} to version ${verNum}?`)) return;
        try {
          await fetch(`/api/v1/memories/${memId}/rollback?target_version=${verNum}&reason=Manual+admin+rollback`, { method: "POST" });
          refreshData();
          if (selectedMemory) handleSelectMemory(selectedMemory);
        } catch (e) {
          alert("Rollback failed: " + e.message);
        }
      };

      // Resolve Contradiction
      const handleResolveContradiction = async (reviewId, resolution) => {
        try {
          await fetch(`/api/v1/governance/contradictions/${reviewId}/resolve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              resolution: resolution,
              justification: `Resolved via Governance Console as ${resolution}`,
              actor_id: "admin"
            })
          });
          refreshData();
        } catch (e) {
          alert("Resolution failed: " + e.message);
        }
      };

      // Sign Approval
      const handleApprovalAction = async (reqId, action) => {
        try {
          await fetch(`/api/v1/governance/approvals/${reqId}/action`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              approver_id: "lead_compliance_officer",
              action: action,
              note: "Verified compliance with enterprise standard"
            })
          });
          refreshData();
        } catch (e) {
          alert("Approval action failed: " + e.message);
        }
      };

      // Run 5-Min Guided Story
      const runGuidedStory = async () => {
        setDemoRunning(true);
        setDemoLog([]);
        const addLog = (msg) => setDemoLog(prev => [...prev, `${new Date().toLocaleTimeString()}: ${msg}`]);

        try {
          setDemoStep(1);
          addLog("Step 1: Baseline Test - Billing Agent receives enterprise refund request without shared memory...");
          const step1 = await fetch("/api/v1/interactions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              agent_id: "Billing Agent",
              user_prompt: "Can I get an immediate refund of $14,500 on our annual enterprise license?",
              task_type: "refund",
              customer_tier: "enterprise"
            })
          }).then(r => r.json());
          addLog(`Step 1 Result: Billing Agent emitted action '${step1.action_type}'.`);

          setDemoStep(2);
          addLog("Step 2: Human Supervisor corrects the mistake and LearnMesh AI generalizes policy...");
          const step2 = await fetch(`/api/v1/interactions/${step1.interaction_id || step1.id}/correction`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              correction_text: "Do not promise an immediate refund for enterprise customers. All refunds require a return label and VP sign-off.",
              human_reason: "Protect financial reserves and compliance"
            })
          }).then(r => r.json());
          addLog(`Step 2 Result: Generalized lesson candidate created: '${(step2.extracted_lesson || step2.correction_text || "lesson").substring(0, 50)}...'`);

          setDemoStep(3);
          addLog("Step 3: Promoting lesson into Hindsight Shared Memory with Confidence 2.0 & tamper-evident audit...");
          const step3 = await fetch(`/api/v1/lessons/${step2.candidate_id}/validate`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              candidate_id: step2.candidate_id,
              confirmed_lesson: step2.extracted_lesson || step2.correction_text,
              target_scope: ["Billing Agent", "Support Agent", "Account Management Agent", "Warehouse Operations"]
            })
          }).then(r => r.json());
          addLog(`Step 3 Result: Memory promoted (${step3.memory_id || step3.candidate_id || "pending"}) with Confidence '${step3.confidence_level || "—"}'.`);

          setDemoStep(4);
          addLog("Step 4: Cross-Agent Transfer - Testing Support Agent on identical scenario. Will it remember Billing's lesson?");
          const step4 = await fetch("/api/v1/agents/pipeline/execute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              agent_id: "Support Agent",
              user_prompt: "Can I get an immediate cash refund for our enterprise account?",
              task_type: "refund",
              customer_tier: "enterprise"
            })
          }).then(r => r.json());
          addLog(`Step 4 Result: Support Agent recalled ${step4.used_memory_ids?.length || 1} memory! Enforced guardrail '${step4.action_type}'. Zero repeated mistakes!`);

          setDemoStep(5);
          addLog("Step 5: Cryptographic Audit Verification - Verifying SHA-256 hash chain...");
          const step5 = await fetch("/api/v1/governance/audit-log/verify").then(r => r.json());
          addLog(`Step 5 Result: Audit integrity '${step5.status}' - ${step5.total_entries} blocks verified without tampering.`);

          addLog("✨ Guided Story Completed Successfully! 'Correct once. Learn everywhere.' demonstrated.");

                    <button
                      onClick={refreshData}
                      className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold"
                    >
                      Re-Verify Cryptographic Integrity
                    </button>
                  </div>

                  {auditIntegrity && (
                    <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between text-xs font-mono">
                      <div>
                        <span className="text-slate-500">HEAD HASH: </span>
                        <span className="text-indigo-400 font-bold">{auditIntegrity.head_hash || "GENESIS"}</span>
                      </div>
                      <span className="text-emerald-400 font-semibold">{auditIntegrity.total_entries} Blocks Verified</span>
                    </div>
                  )}

                  {/* AUDIT LOG TABLE */}
                  <div className="rounded-xl border border-slate-800 overflow-hidden text-xs">
                    <table className="w-full text-left">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800 font-mono text-[11px]">
                        <tr>
                          <th className="p-3">Seq #</th>
                          <th className="p-3">Timestamp</th>
                          <th className="p-3">Action</th>
                          <th className="p-3">Actor</th>
                          <th className="p-3">Target Entity</th>
                          <th className="p-3">SHA-256 Hash</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60 bg-slate-950/60 text-slate-300 font-mono text-[11px]">
                        {auditLog.map(entry => (
                          <tr key={entry.id} className="hover:bg-slate-800/30">
                            <td className="p-3 font-bold text-indigo-400">#{entry.sequence_number}</td>
                            <td className="p-3 text-slate-400">{new Date(entry.created_at).toLocaleTimeString()}</td>
                            <td className="p-3 text-white font-sans font-semibold">{entry.action}</td>
                            <td className="p-3 text-slate-400">{entry.actor_id}</td>
                            <td className="p-3 text-slate-300">{entry.target_entity} ({entry.target_id?.substring(0, 10)})</td>
                            <td className="p-3 text-cyan-400 truncate max-w-xs">{entry.entry_hash?.substring(0, 20)}...</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* GDPR RIGHT TO BE FORGOTTEN TOOL */}
                <div className="p-6 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-4">
                  <div className="flex items-center justify-between">
                    <div>
                      <h4 className="text-base font-bold text-white">GDPR Article 17 / CCPA Data Erasure Tool</h4>
                      <p className="text-xs text-slate-400">Irreversibly purge and anonymize customer identifiers across interactions and memories with cryptographic audit proof.</p>
                    </div>
                  </div>
                  <div className="flex items-center space-x-3 text-xs">
                    <input
                      type="text"
                      value={forgetCustId}
                      onChange={e => setForgetCustId(e.target.value)}
                      placeholder="Customer ID (e.g. cust-enterprise-01)"
                      className="bg-slate-950 border border-slate-800 rounded px-3 py-2 text-white font-mono w-72"
                    />
                    <button
                      onClick={async () => {
                        if (!confirm(`Purge all personal data for customer ${forgetCustId}?`)) return;
                        const res = await fetch(`/api/v1/compliance/forget-customer/${forgetCustId}`, { method: "DELETE" });
                        const data = await res.json();
                        setForgetResult(data);
                        refreshData();
                      }}
                      className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold rounded text-xs shadow-md shadow-red-600/30"
                    >
                      Purge Customer (GDPR)
                    </button>
                  </div>
                  {forgetResult && (
                    <div className="p-3 rounded-lg bg-slate-950 border border-slate-800 text-xs font-mono text-emerald-400">
                      ✓ Status: {forgetResult.status} — Anonymized {forgetResult.interactions_anonymized} interaction(s) for customer {forgetResult.customer_id}.
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* TAB: SYSTEM DIAGNOSTICS */}
            {currentTab === "status" && (
              <div className="max-w-3xl mx-auto space-y-6">
                <h3 className="text-base font-bold text-white">Enterprise Health & Service Topology</h3>
                <div className="space-y-4 text-xs">
                  <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-sm font-bold text-slate-200">Hindsight Long-Term Memory Daemon</div>
                      <div className="text-slate-400 mt-0.5">Address: http://localhost:8888 (with circuit breaker & degraded local cache)</div>
                    </div>
                    <span className="px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-semibold font-mono">
                      OPERATIONAL
                    </span>
                  </div>

                  <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-sm font-bold text-slate-200">Groq LLM Engine & Fallback Router</div>
                      <div className="text-slate-400 mt-0.5">Model: llama-3.3-70b-versatile (Multi-provider resilient)</div>
                    </div>
                    <span className="px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-semibold font-mono">
                      {systemStatus?.groq?.connected ? "CONNECTED (Groq)" : "DETERMINISTIC FALLBACK"}
                    </span>
                  </div>

                  <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-sm font-bold text-slate-200">Relational Database & Migrations</div>
                      <div className="text-slate-400 mt-0.5">Alembic Version: e7322935d345 (SQLite / PostgreSQL Pool)</div>
                    </div>
                    <span className="px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-semibold font-mono">
                      MIGRATED (Head)
                    </span>
                  </div>

                  <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                    <div>
                      <div className="text-sm font-bold text-slate-200">Kubernetes Health Probes & Metrics</div>
                      <div className="text-slate-400 mt-0.5">Endpoints: /health/live, /health/ready, /metrics (Prometheus)</div>
                    </div>
                    <span className="px-3 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/60 font-semibold font-mono">
                      HEALTHY
                    </span>
                  </div>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
